name: CI
run-name: CI [${{ (github.event_name == 'pull_request' && github.base_ref) || (true && github.ref) }}]

on:
  push:
    branches: [main]

  pull_request:
    # Packaging below runs only for a merged PR, so closed must be included.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  test-and-package:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
      - if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: npm run package:marketplace
      - if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/upload-artifact@v6
        with:
          name: fnote-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
